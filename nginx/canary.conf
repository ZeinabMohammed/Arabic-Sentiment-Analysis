# Canary rollout: 95% of traffic to the stable (Production) model,
# 5% to the canary (candidate) model. Promote the candidate by raising its
# weight in stages: 5 -> 25 -> 50 -> 100, watching PSI/latency in Grafana
# between each stage (documented in README "Canary rollout" section).
upstream arabic_sentiment {
    server api-stable:8000 weight=95;
    server api-canary:8000 weight=5;
}

server {
    listen 80;

    location /predict {
        proxy_pass http://arabic_sentiment;
        proxy_set_header Host $host;
    }

    location /health {
        proxy_pass http://arabic_sentiment;
    }

    location /metrics {
        proxy_pass http://arabic_sentiment;
    }
}
