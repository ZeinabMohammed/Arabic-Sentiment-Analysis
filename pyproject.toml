[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "arabic-sentiment"
version = "0.1.0"
description = "Arabic e-commerce review sentiment classification — MLOps Practitioner course, Project 1 (Deep Learning track)"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "datasets>=2.19",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "mlflow>=2.13",
    "dvc>=3.50",
    "bentoml>=1.2",
    "evidently>=0.4",
    "prometheus-client>=0.20",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "scikit-learn>=1.4",
    "accelerate>=0.30",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "httpx>=0.27", "ruff>=0.4", "locust>=2.26"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
