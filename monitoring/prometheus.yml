global:
  scrape_interval: 15s

scrape_configs:
  - job_name: arabic-sentiment-api
    static_configs:
      - targets: ["api-stable:8000"]
        labels: { track: stable }
      - targets: ["api-canary:8000"]
        labels: { track: canary }

  - job_name: drift-exporter
    static_configs:
      - targets: ["drift-exporter:9100"]
