services:
  api-stable:
    build: .
    environment:
      MODEL_PATH: ${STABLE_MODEL_PATH:-aubmindlab/bert-base-arabertv02}
      MODEL_VERSION: stable
    ports:
      - "8000:8000"

  api-canary:
    build: .
    environment:
      MODEL_PATH: ${CANARY_MODEL_PATH:-aubmindlab/bert-base-arabertv02}
      MODEL_VERSION: canary
    ports:
      - "8001:8000"

  nginx:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/canary.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on:
      - api-stable
      - api-canary

  mlflow:
    build: .
    entrypoint: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000",
                 "--backend-store-uri", "sqlite:////app/mlflow.db",
                 "--default-artifact-root", "/app/mlartifacts"]
    volumes:
      - ./mlflow.db:/app/mlflow.db
      - ./mlartifacts:/app/mlartifacts
    ports:
      - "5000:5000"

  drift-exporter:
    build: .
    entrypoint: ["python", "-m", "src.monitoring.metrics_exporter"]
    volumes:
      - ./reports:/app/reports
    ports:
      - "9100:9100"

  prometheus:
    image: prom/prometheus:v2.53.0
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    depends_on:
      - api-stable
      - api-canary
      - drift-exporter

  grafana:
    image: grafana/grafana:11.1.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    ports:
      - "3000:3000"
    depends_on:
      - prometheus
